{% for field in fields %}
  {% if field.widget_type == "checkbox" %}
    <div class="field">
      <label class="check">{{ field }} {{ field.label }}</label>
      {% if field.help_text %}<div class="muted small">{{ field.help_text }}</div>{% endif %}
      {{ field.errors }}
    </div>
  {% else %}
    <div class="field{% if field.widget_type == 'checkboxselectmultiple' %} radios days-pick{% endif %}">
      {{ field.label_tag }}{{ field }}
      {% if field.help_text %}<div class="muted small">{{ field.help_text }}</div>{% endif %}
      {{ field.errors }}
    </div>
  {% endif %}
{% endfor %}
